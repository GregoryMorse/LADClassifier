  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="258" y="111" fill="#f6f9ff" font-size="60"
          font-weight="700" letter-spacing="-1">LAD</text>
    <text x="375" y="111" fill="#7fe89a" font-size="60"
