<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240"
     viewBox="0 0 920 240" role="img"
     aria-labelledby="logo-title logo-description">
  <title id="logo-title">LADClassifier</title>
  <desc id="logo-description">
    A logical data pattern selected from a field of observations.
  </desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#172947"/>
    </linearGradient>
    <linearGradient id="pattern" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#32d79a"/>
      <stop offset="1" stop-color="#8bea72"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="904" height="224" rx="32"
        fill="url(#panel)" stroke="#263b5b" stroke-width="2"/>

  <g transform="translate(40 30)">
    <rect width="180" height="180" rx="28" fill="#0b1427"
          stroke="#304566" stroke-width="2"/>
    <path d="M29 42H18v112h11M151 42h11v112h-11"
          fill="none" stroke="#87a0c3" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#7488a7">
      <circle cx="48" cy="58" r="7"/>
      <circle cx="86" cy="55" r="7"/>
      <circle cx="128" cy="62" r="7"/>
      <circle cx="48" cy="95" r="7"/>
      <circle cx="130" cy="98" r="7"/>
      <circle cx="51" cy="139" r="7"/>
      <circle cx="91" cy="142" r="7"/>
      <circle cx="132" cy="137" r="7"/>
    </g>
    <rect x="69" y="76" width="48" height="48" rx="10"
          fill="#173c36" stroke="url(#pattern)" stroke-width="3"/>
    <circle cx="84" cy="92" r="7" fill="#45dda4"/>
    <circle cx="102" cy="108" r="7" fill="#8bea72"/>
    <path d="M79 124l-9 17M112 76l9-17" stroke="#45dda4"
